extends: .github

queue_rules:
  - name: default
    queue_conditions:
      - base = main
      - "#approved-reviews-by>=2"
      - "#changes-requested-reviews-by=0"
      - "#review-threads-unresolved=0"
      - "#review-requested=0"
    commit_message_format:
      title: pr-title
      body: pr-body
      trailers:
        - approved-by
    merge_method: squash

pull_request_rules:
  - name: request review
    conditions:
      - -author=renovate[bot]
      - -merged
      - -closed
      - "#approved-reviews-by=0"
      - "#changes-requested-reviews-by=0"
      - "review-requested!=@devs"
    actions:
      request_reviews:
        teams:
          - devs

merge_queue:
  max_parallel_checks: 5

merge_protections_settings:
  reporting_method: deployments
  auto_merge_conditions: true
